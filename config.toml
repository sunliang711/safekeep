# SafeKeep 默认配置文件
# 优先级：命令行参数 > 环境变量 (SAFEKEEP_*) > config.toml > 内置默认值

[server]
# HTTP 服务监听地址
listen = ":8333"
# SQLite 数据库、主密钥 (master.key) 等持久化数据目录
data_dir = "./data"
# 可选：32 字节加密主密钥（64 位十六进制或 Base64）；留空则自动在 data_dir 下生成 master.key
master_key = ""
# 可选：启动时重置主管理员密码为一次性随机临时密码并强制首次登录后改密（也可通过 RESET_ADMIN=true 环境变量启用）
reset_admin = false
# 可选：允许跨域访问管理端或 API 的前端 Origin 白名单
cors_allowed_origins = []

[defaults]
# 对外访问基准地址（用于 Dropbox OAuth2 回调与同源校验）
public_base_url = "http://localhost:8333"
# 临时文件缓冲目录（建议为 data_dir 的子目录）
spool_dir = "./data/spool"
# 说明：上传限额（默认 100 MiB）、每日流量熔断（默认 1 GiB）、缓冲上限及 Worker/超时/重试等调度参数
# 统一存储在 SQLite 数据库中，请在 Web 管理端「系统设置 -> 全局运行参数」页面配置。

[smtp]
# SMTP 邮件告警配置（也可在 Web 管理端直接配置，或通过 SAFEKEEP_SMTP_* 环境变量覆盖）
enabled = false
host = ""
port = 587
tls_mode = "starttls" # starttls | tls | none
username = ""
password = ""
from_email = ""
from_name = "SafeKeep"
to_emails = []
